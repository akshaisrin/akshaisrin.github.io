<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1f3d" />
    <title>404 – Page not found</title>
    <style>
      body {
        margin: 0;
        background: #0f1f3d;
        color: #e6edf7;
        font-family: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.55;
      }
      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 0 24px;
      }
      .sheet {
        width: min(36rem, 100%);
        margin: 0 auto;
        border-top: 1px solid #e6edf7;
        padding-top: 24px;
      }
      .code {
        margin: 0;
        font-size: clamp(4rem, 12vw, 7rem);
        line-height: 1;
        letter-spacing: 0.02em;
      }
      h1 {
        margin: 16px 0 0;
        font-size: 1.6rem;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      p {
        margin: 12px 0 0;
        color: #b7c5da;
        max-width: 66ch;
      }
      a {
        display: inline-block;
        margin-top: 32px;
        padding: 10px 16px;
        border: 1px solid #e6edf7;
        color: #e6edf7;
        text-decoration: none;
      }
      a:hover {
        background: #e6edf7;
        color: #0f1f3d;
      }
    </style>

    <script>
      (function () {
        var path = (window.location.pathname || '').replace(/\/+$/, '');

        var section = '';
        if (path.endsWith('/projects')) section = 'projects';
        else if (path.endsWith('/experience')) section = 'experience';
        else if (path.endsWith('/skills')) section = 'skills';
        else if (path.endsWith('/about')) section = 'about';
        else if (path.endsWith('/contact')) section = 'contact';

        if (section) {
          window.location.replace('./#' + section);
          return;
        }

        try {
          sessionStorage.setItem('requestedPath', path || '/');
        } catch (e) {
          // Ignore storage errors (private mode, etc).
        }
        window.location.replace('./#/404');
      })();
    </script>
  </head>
  <body style="display:none">
    <main>
      <div class="sheet">
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="./">Back to home</a>
      </div>
    </main>
  </body>
</html>
